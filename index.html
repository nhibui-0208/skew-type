<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typography Poster</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0d0f;color:#e8e8ea;font:13px/1.4 system-ui,-apple-system,sans-serif}
body{display:flex}
#side{width:300px;flex:none;height:100vh;overflow:auto;background:#17171a;border-right:1px solid #2a2a30;padding:18px;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8b8b95;font-weight:600}
.g{display:flex;flex-direction:column;gap:8px}
.g>span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7c7c86}
textarea{width:100%;height:96px;resize:vertical;background:#0d0d0f;border:1px solid #2f2f36;border-radius:6px;color:#fff;padding:8px;font:600 15px/1.3 system-ui;text-transform:uppercase}
button{background:#25252b;color:#e8e8ea;border:1px solid #34343c;border-radius:6px;padding:8px 10px;font:inherit;cursor:pointer}
button:hover{background:#2e2e36}
button.on{background:#e8e8ea;color:#111;border-color:#e8e8ea}
.seg{display:flex;gap:6px}
.sw{display:flex;gap:8px}
.sw>div{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font:12px ui-monospace,monospace}
.chip{width:26px;height:26px;padding:0;border:1px solid #444;border-radius:4px;flex:none;cursor:pointer}
.chip.open{border-color:#e8e8ea}
#pick{position:fixed;z-index:20;width:264px;background:#1f1f24;border:1px solid #34343c;border-radius:10px;padding:12px;box-shadow:0 12px 40px #000a;display:flex;flex-direction:column;gap:10px}
#pick[hidden]{display:none}
#wheel{width:200px;height:200px;align-self:center;cursor:crosshair;touch-action:none}
#vr{-webkit-appearance:none;appearance:none;width:100%;height:14px;margin:0;border-radius:7px;background:linear-gradient(90deg,#000,var(--c,#fff));outline:none}
#vr::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #111;box-shadow:0 0 0 1px #fff}
#vr::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #111}
.row{display:flex;align-items:center;gap:6px}
.row>span{width:40px;flex:none;font-size:11px;letter-spacing:.08em;color:#7c7c86}
.row input{flex:1;min-width:0;height:28px;background:#0d0d0f;border:1px solid #2f2f36;border-radius:4px;color:#e8e8ea;padding:0 4px;font:12px ui-monospace,monospace;text-align:center;text-transform:uppercase}
.row input:focus{outline:none;border-color:#e8e8ea}
.row input.bad{border-color:#d9534f}
.row input[type=number]{-moz-appearance:textfield;appearance:textfield}
.row input::-webkit-inner-spin-button,.row input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.seg button{display:flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0}
.seg svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.fname{font-weight:600;font-size:14px;word-break:break-all}
.drop{display:block;border:1.5px dashed #3a3a44;border-radius:8px;padding:16px 10px;text-align:center;color:#8b8b95;font-size:12px;cursor:pointer}
.drop:hover,.drop.over{border-color:#e8e8ea;color:#e8e8ea;background:#1f1f24}
.drop input{display:none}
#msg{font-size:12px;color:#e0b050;min-height:1em}
#stage{flex:1;min-width:0;height:100vh;display:grid;place-items:center;padding:24px}
#stage svg{width:min(calc(100vw - 300px - 48px),calc((100vh - 48px)*.8));aspect-ratio:4/5;height:auto;box-shadow:0 10px 40px #0008}
</style>
</head>
<body>
<aside id="side">
  <h1>Distort Type Testing</h1>
  <div class="g"><span>Text</span><textarea id="txt">GY
DIENT</textarea></div>
  <div class="g"><span>Properties</span>
    <div class="seg" id="hSeg">
      <button data-h="left" title="Left" aria-label="Left"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></svg></button>
      <button data-h="center" title="Center" aria-label="Center"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M5.5 18h13"/></svg></button>
      <button data-h="right" title="Right" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M4 6h16M10 12h10M7 18h13"/></svg></button></div>
    <div class="seg" id="vSeg">
      <button data-v="top" title="Top" aria-label="Top"><svg viewBox="0 0 24 24"><path d="M4 4h16M7 8v10M12 8v6M17 8v8"/></svg></button>
      <button data-v="middle" title="Middle" aria-label="Middle"><svg viewBox="0 0 24 24"><path d="M4 12h16M7 6v12M12 8v8M17 9v6"/></svg></button>
      <button data-v="bottom" title="Bottom" aria-label="Bottom"><svg viewBox="0 0 24 24"><path d="M4 20h16M7 6v12M12 10v8M17 8v10"/></svg></button></div></div>
  <div class="g"><button id="rSkew">Random skew</button></div>
  <div class="g"><button id="rColor">Random color</button>
    <div class="sw">
      <div><button type="button" class="chip" id="cBg" aria-label="Background color" title="Chọn màu nền"></button><b id="hxBg"></b></div>
      <div><button type="button" class="chip" id="cFg" aria-label="Text color" title="Chọn màu chữ"></button><b id="hxFg"></b></div></div></div>
  <div class="g"><span>Font</span>
    <div class="fname" id="fname"></div>
    <label class="drop" id="drop">Kéo thả font vào đây<br>hoặc bấm để chọn (.ttf .otf .woff .woff2)
      <input type="file" id="font" accept=".ttf,.otf,.woff,.woff2"></label>
    <button id="rFont">Reset font</button></div>
  <div class="g"><span>Export</span>
    <button id="sPng">Save PNG</button><button id="sSvg">Save SVG</button></div>
  <div id="msg"></div>
</aside>
<main id="stage"></main>
<div id="pick" hidden>
  <canvas id="wheel" width="400" height="400"></canvas>
  <input type="range" id="vr" min="0" max="100" value="100" aria-label="Brightness">
  <div class="row"><span>HEX</span><input type="text" id="pHex" maxlength="7" spellcheck="false" autocomplete="off" aria-label="HEX"></div>
  <div class="row"><span>RGB</span><input type="number" id="pR" min="0" max="255" aria-label="R"><input type="number" id="pG" min="0" max="255" aria-label="G"><input type="number" id="pB" min="0" max="255" aria-label="B"></div>
  <div class="row"><span>CMYK</span><input type="number" id="pC" min="0" max="100" aria-label="C"><input type="number" id="pM" min="0" max="100" aria-label="M"><input type="number" id="pY" min="0" max="100" aria-label="Y"><input type="number" id="pK" min="0" max="100" aria-label="K"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
<script>
/* ===== Hằng số cấu hình ===== */
const C={
  W:1080,H:1350,        // kích thước frame
  PAD:0,                // padding quanh frame (px)
  LS:0.05,              // letter-spacing (tỉ lệ font-size)
  GAP:-0.02,            // khe hở giữa các hàng (tỉ lệ font-size, tính trên bbox đã gồm dấu); âm = bbox các hàng chạm/chồng nhau
  OVS:1.05,             // glyph cao hơn cap-height x OVS mới tính là có dấu (bỏ qua overshoot của chữ tròn)
  DESC_MIN:0.03,        // glyph thò xuống dưới baseline quá tỉ lệ này (x font-size) mới tính (vd dấu nặng ạ)
  SKEW_MIN:15,SKEW_MAX:45, // góc skew (độ)
  SKEW_N:[2,3],         // số ký tự bị skew
  REF:200,              // font-size tham chiếu để đo
  SAT:[90,100],         // saturation cao (%)
  LIG_L:[60,76],LIG_D:[12,28], // độ sáng tone sáng / tone tối (%)
  MIN_CR:4.5,           // tương phản tối thiểu giữa nền & chữ (WCAG)
  NEU_P:0.4,            // xác suất có 1 màu trung tính (trắng/đen/xám) khi random
  NEU_BOTH:0.2,         // trong số đó, xác suất CẢ nền lẫn chữ đều trung tính
  GRAY_L:[78,90],GRAY_D:[10,24], // độ sáng xám nhạt / xám đậm (%)
  DEF_FAM:'"Avenir Next Condensed","Helvetica Neue Condensed Bold","Arial Narrow",sans-serif',
  DEF_W:800,
  DEF_NAME:'Avenir Next Condensed'
};
const $=id=>document.getElementById(id);
const ctx=document.createElement('canvas').getContext('2d');
const st={text:$('txt').value,h:'center',v:'middle',bg:'#000000',fg:'#FFFFFF',skew:{},fam:C.DEF_FAM,weight:C.DEF_W,buf:null,face:null,localOT:null,fname:'Avenir Next Condensed'};
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndInt=(a,b)=>Math.floor(rnd(a,b+1));
const msg=t=>$('msg').textContent=t||'';

/* ===== Dòng chữ & skew ===== */
const rowsOf=()=>st.text.normalize('NFC').toUpperCase().split('\n').map(r=>r.trim()).filter(Boolean);
const countGlyphs=()=>rowsOf().join('').replace(/\s/g,'').length;
function randomSkew(){ // bốc 2–3 ký tự ngẫu nhiên + góc ngẫu nhiên
  const n=countGlyphs();st.skew={};if(!n)return;
  const k=Math.min(n,rndInt(...C.SKEW_N));
  [...Array(n).keys()].sort(()=>Math.random()-.5).slice(0,k)
    .forEach(i=>st.skew[i]=(Math.random()<.5?-1:1)*rnd(C.SKEW_MIN,C.SKEW_MAX));
}
function ensureSkew(){ // giữ skew cũ nếu còn hợp lệ khi sửa text
  const n=countGlyphs();
  Object.keys(st.skew).forEach(k=>{if(+k>=n)delete st.skew[k]});
  if(Object.keys(st.skew).length<Math.min(n,C.SKEW_N[0]))randomSkew();
}

/* ===== Màu ngẫu nhiên (hue bù nhau +180°, saturation cao, một sáng + một tối) ===== */
function hsl2hex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));
  return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('').toUpperCase();}
const gray=l=>hsl2hex(0,0,l);
const NEU={ // màu trung tính: sáng = trắng hoặc xám nhạt, tối = đen hoặc xám đậm
  light:()=>Math.random()<.5?'#FFFFFF':gray(rnd(...C.GRAY_L)),
  dark:()=>Math.random()<.5?'#000000':gray(rnd(...C.GRAY_D))
};
const lum=h=>{const v=[1,3,5].map(i=>{const c=parseInt(h.slice(i,i+2),16)/255;return c<=.03928?c/12.92:((c+.055)/1.055)**2.4});return .2126*v[0]+.7152*v[1]+.0722*v[2];};
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
function pickPair(){ // nền/chữ luôn một sáng một tối
  const h=rnd(0,360),bgLight=Math.random()<.5;
  const col=(hh,light)=>hsl2hex(hh,rnd(...C.SAT),rnd(...(light?C.LIG_L:C.LIG_D)));
  const neu=light=>light?NEU.light():NEU.dark();
  let bg=col(h,bgLight),fg=col((h+180)%360,!bgLight);
  if(Math.random()<C.NEU_P){
    if(Math.random()<C.NEU_BOTH){bg=neu(bgLight);fg=neu(!bgLight);} // cả hai trung tính
    else if(Math.random()<.5)bg=neu(bgLight);                       // nền trung tính, chữ có màu
    else fg=neu(!bgLight);                                          // chữ trung tính, nền có màu
  }
  return{bg,fg};
}
function randomColor(){ // thử lại tới khi đủ tương phản (tối đa 40 lần)
  let best=null;
  for(let i=0;i<40;i++){
    const p=pickPair(),cr=contrast(p.bg,p.fg);
    if(!best||cr>best.cr)best={...p,cr};
    if(cr>=C.MIN_CR)break;
  }
  st.bg=best.bg;st.fg=best.fg;
}

/* ===== Layout: trả về danh sách glyph + transform ===== */
function layout(){
  const rows=rowsOf();if(!rows.length)return[];
  const S=C.REF;ctx.font=`${st.weight} ${S}px ${st.fam}`;
  const cap=ctx.measureText('H').actualBoundingBoxAscent||S*.7;
  const ls=C.LS*S;let gi=0;
  // Đo từng hàng; glyph bị skew được cộng thêm padding để không chồng lên nhau
  // asc/desc: bbox dọc của hàng, tính cả dấu (Ấ, Ể, Ặ...) -> hàng có dấu sẽ thấp chữ hơn để dấu không tràn sang hàng khác
  const R=rows.map(r=>{let x=0,asc=cap,desc=0;const items=[];
    for(const ch of r){
      const m=ctx.measureText(ch),adv=m.width;
      let ga=cap,gd=0; // ga/gd: phần cao trên / thấp dưới baseline của riêng glyph này
      if(ch!==' '){
        if(m.actualBoundingBoxAscent>cap*C.OVS){ga=m.actualBoundingBoxAscent;asc=Math.max(asc,ga);}
        if(m.actualBoundingBoxDescent>S*C.DESC_MIN){gd=m.actualBoundingBoxDescent;desc=Math.max(desc,gd);}
      }
      const key=ch===' '?-1:gi++;
      const a=key>=0?(st.skew[key]||0):0,t=Math.tan(a*Math.PI/180);
      x+=Math.max(0,t*ga,-t*gd);
      items.push({ch,x,adv,a});
      x+=adv+Math.max(0,-t*ga,t*gd)+ls;
    }
    return{items,w:x-ls,asc,desc};});
  const availW=C.W-2*C.PAD,availH=C.H-2*C.PAD;
  const sx=availW/Math.max(...R.map(r=>r.w)); // hàng dài nhất chạm hết ngang
  // Trọng số chiều cao: Top = hàng đầu 1, còn lại 2; Bottom = hàng cuối 1, còn lại 2
  const n=R.length;
  const wt=R.map((_,i)=>n===1||st.v==='middle'?1:(st.v==='top'?(i===0?1:2):(i===n-1?1:2)));
  const sum=wt.reduce((a,b)=>a+b,0);
  let top=C.PAD;const out=[];
  R.forEach((r,i)=>{
    const gap=C.GAP*S,hh=availH*wt[i]/sum;
    const gt=i>0?gap/2:0,gb=i<n-1?gap/2:0;      // khe hở chỉ áp giữa các hàng, không áp ra mép frame
    const sy=hh/(r.asc+r.desc+gt+gb);           // bbox hàng (gồm dấu) vừa khít chiều cao hàng
    const base=top+sy*(r.asc+gt); top+=hh;      // baseline = đỉnh bbox + phần trên
    const free=availW-r.w*sx;
    const off=C.PAD+(st.h==='left'?0:st.h==='right'?free:free/2);
    r.items.forEach(it=>{if(it.ch!==' ')out.push({ch:it.ch,tx:off+it.x*sx,ty:base,sx,sy,cx:it.adv/2,a:it.a});});
  });
  return out;
}
const tf=o=>`translate(${o.tx.toFixed(2)},${o.ty.toFixed(2)}) scale(${o.sx.toFixed(4)},${o.sy.toFixed(4)}) translate(${o.cx.toFixed(2)},0) skewX(${o.a.toFixed(2)}) translate(${(-o.cx).toFixed(2)},0)`;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ===== Dựng SVG (ot = font opentype hoặc null) ===== */
function svgString(ot){
  const fam=st.fam.replace(/"/g,"'");
  const g=layout().map(o=>ot
    ?`<path transform="${tf(o)}" d="${ot.getPath(o.ch,0,0,C.REF).toPathData(2)}"/>`
    :`<text transform="${tf(o)}">${esc(o.ch)}</text>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${C.W} ${C.H}" width="${C.W}" height="${C.H}"><rect width="${C.W}" height="${C.H}" fill="${st.bg}"/><g fill="${st.fg}"${ot?'':` font-family="${fam}" font-size="${C.REF}" font-weight="${st.weight}"`}>${g}</g></svg>`;
}
function render(){
  $('stage').innerHTML=svgString(null);
  $('fname').textContent=st.fname;
  [['Bg','bg'],['Fg','fg']].forEach(([k,p])=>{$('c'+k).style.background=st[p];$('hx'+k).textContent=st[p];});
  document.querySelectorAll('[data-h]').forEach(b=>b.classList.toggle('on',b.dataset.h===st.h));
  document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===st.v));
}

/* ===== Export ===== */
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function savePNG(){ // vẽ lại bằng canvas đúng 1080x1350
  const cv=document.createElement('canvas');cv.width=C.W;cv.height=C.H;
  const g=cv.getContext('2d');
  g.fillStyle=st.bg;g.fillRect(0,0,C.W,C.H);
  g.fillStyle=st.fg;g.font=`${st.weight} ${C.REF}px ${st.fam}`;
  layout().forEach(o=>{
    g.save();g.translate(o.tx,o.ty);g.scale(o.sx,o.sy);g.translate(o.cx,0);
    g.transform(1,0,Math.tan(o.a*Math.PI/180),1,0,0);g.translate(-o.cx,0);
    g.fillText(o.ch,0,0);g.restore();
  });
  cv.toBlob(b=>dl(b,`poster-${Date.now()}.png`),'image/png');
}
async function getOT(){ // lấy dữ liệu font để outline
  if(typeof opentype==='undefined')return null;
  try{
    if(st.buf)return opentype.parse(st.buf.slice(0));
    if(st.localOT)return st.localOT;
    if(window.queryLocalFonts){
      const list=(await queryLocalFonts()).filter(f=>f.family.toLowerCase()===C.DEF_NAME.toLowerCase());
      const p=list.find(f=>/heavy/i.test(f.style))||list.find(f=>/bold/i.test(f.style))||list[0];
      if(p)return st.localOT=opentype.parse(await(await p.blob()).arrayBuffer());
    }
  }catch(e){}
  return null;
}
async function saveSVG(){
  const ot=await getOT();
  dl(new Blob([svgString(ot)],{type:'image/svg+xml'}),`poster-${Date.now()}.svg`);
  msg(ot?'':'Không lấy được dữ liệu font: SVG dùng thẻ <text>, chữ chưa được outline.');
}

/* ===== Font ===== */
function hasFont(name){ // so sánh độ rộng với font nền để phát hiện font có cài hay chưa
  const w=f=>{ctx.font=`72px ${f}`;return ctx.measureText('mmmmmmmmWiIl').width};
  return['monospace','serif'].some(b=>w(`"${name}",${b}`)!==w(b));
}
function checkDefault(){if(!st.buf&&!hasFont(C.DEF_NAME))msg('Máy chưa có Avenir Next Condensed — hãy upload font ở mục Font.');}
function resetFont(){ // quay về font mặc định
  if(st.face)document.fonts.delete(st.face);
  st.face=null;st.buf=null;st.localOT=null;st.fam=C.DEF_FAM;st.weight=C.DEF_W;st.fname=C.DEF_NAME;
  msg('');checkDefault();render();
}
async function loadFont(file){
  try{
    const buf=await file.arrayBuffer();
    const face=new FontFace('CustomPosterFont',buf.slice(0));
    await face.load();
    if(st.face)document.fonts.delete(st.face);
    document.fonts.add(face);
    st.face=face;st.buf=buf;st.fam='"CustomPosterFont",sans-serif';st.weight=400;st.fname=file.name.replace(/\.[^.]+$/,'');
    msg('');render();
  }catch(e){msg('Không đọc được file font này.');}
}

/* ===== Sự kiện ===== */
$('txt').oninput=e=>{st.text=e.target.value;ensureSkew();render();};
document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{st.h=b.dataset.h;render();});
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{st.v=b.dataset.v;render();});
$('rSkew').onclick=()=>{randomSkew();render();};
$('rColor').onclick=()=>{randomColor();render();};
const normHex=v=>{v=v.trim().replace(/^#/,'');if(/^[0-9a-f]{3}$/i.test(v))v=v.replace(/./g,'$&$&');return/^[0-9a-f]{6}$/i.test(v)?'#'+v.toUpperCase():null;};

$('font').onchange=e=>{e.target.files[0]&&loadFont(e.target.files[0]);e.target.value='';};
$('rFont').onclick=resetFont;
const drop=$('drop');
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>e.dataTransfer.files[0]&&loadFont(e.dataTransfer.files[0]));
$('sPng').onclick=savePNG;
$('sSvg').onclick=saveSVG;

/* ===== Chuyển đổi màu ===== */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb2hex=(r,g,b)=>'#'+[r,g,b].map(x=>Math.round(clamp(x,0,255)).toString(16).padStart(2,'0')).join('').toUpperCase();
function hsv2rgb(h,s,v){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1));};return[f(5),f(3),f(1)].map(x=>Math.round(x*255));}
function rgb2hsv(r,g,b,prev){ // gray/đen: giữ lại hue/sat cũ để wheel không nhảy
  r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=prev.h;
  if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h=(h*60+360)%360;}
  return{h,s:mx?d/mx:prev.s,v:mx};
}
const rgb2cmyk=(r,g,b)=>{r/=255;g/=255;b/=255;const k=1-Math.max(r,g,b);if(k>=1)return[0,0,0,100];return[(1-r-k)/(1-k),(1-g-k)/(1-k),(1-b-k)/(1-k),k].map(x=>Math.round(x*100));};
const cmyk2rgb=(c,m,y,k)=>[c,m,y].map(x=>Math.round(255*(1-x/100)*(1-k/100)));
/* ===== Color picker: wheel + HEX / RGB / CMYK ===== */
const pk={t:null,rgb:[0,0,0],h:0,s:0,v:1,cache:null};
const RGB=['pR','pG','pB'],CMYK=['pC','pM','pY','pK'];
function wheelBase(){ // đĩa hue/saturation (v=1), vẽ một lần
  if(pk.cache)return pk.cache;
  const N=400,R=N/2,cv=document.createElement('canvas');cv.width=cv.height=N;
  const g=cv.getContext('2d'),im=g.createImageData(N,N);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const dx=x+.5-R,dy=y+.5-R,d=Math.hypot(dx,dy);if(d>R)continue;
    const [r,gg,b]=hsv2rgb((Math.atan2(dy,dx)*180/Math.PI+360)%360,d/R,1),i=(y*N+x)*4;
    im.data[i]=r;im.data[i+1]=gg;im.data[i+2]=b;im.data[i+3]=d>R-1?Math.round(255*(R-d)):255;
  }
  g.putImageData(im,0,0);return pk.cache=cv;
}
function drawWheel(){
  const cv=$('wheel'),g=cv.getContext('2d'),N=cv.width,R=N/2;
  g.clearRect(0,0,N,N);g.drawImage(wheelBase(),0,0);
  g.fillStyle=`rgba(0,0,0,${1-pk.v})`;g.beginPath();g.arc(R,R,R,0,7);g.fill(); // v thấp -> tối dần
  const a=pk.h*Math.PI/180,x=R+Math.cos(a)*pk.s*R,y=R+Math.sin(a)*pk.s*R;
  g.lineWidth=3;g.strokeStyle='#000';g.beginPath();g.arc(x,y,13,0,7);g.stroke();
  g.lineWidth=4;g.strokeStyle='#fff';g.beginPath();g.arc(x,y,10,0,7);g.stroke();
}
function pkSync(skip){ // đồng bộ mọi ô trừ nhóm đang gõ
  const [r,g,b]=pk.rgb;
  if(skip!=='hex')$('pHex').value=rgb2hex(r,g,b);
  if(skip!=='rgb')RGB.forEach((id,i)=>$(id).value=pk.rgb[i]);
  if(skip!=='cmyk'){const c=rgb2cmyk(r,g,b);CMYK.forEach((id,i)=>$(id).value=c[i]);}
  $('vr').value=Math.round(pk.v*100);
  $('vr').style.setProperty('--c',rgb2hex(...hsv2rgb(pk.h,pk.s,1)));
  drawWheel();
}
function pkApply(skip){st[pk.t]=rgb2hex(...pk.rgb);render();pkSync(skip);}
function pkSetRgb(rgb,skip){pk.rgb=rgb;Object.assign(pk,rgb2hsv(...rgb,pk));pkApply(skip);}
function closePicker(){pk.t=null;$('pick').hidden=true;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('open'));}
function openPicker(t,btn){
  if(pk.t===t){closePicker();return;}
  pk.t=t;pk.rgb=hex2rgb(st[t]);Object.assign(pk,rgb2hsv(...pk.rgb,pk));
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('open',c===btn));
  const p=$('pick');p.hidden=false;pkSync(null);
  const r=btn.getBoundingClientRect();
  p.style.left=($('side').getBoundingClientRect().left+18)+'px';
  p.style.top=Math.max(8,Math.min(r.bottom+8,innerHeight-8-p.offsetHeight))+'px';
}
$('cBg').onclick=e=>openPicker('bg',e.currentTarget);
$('cFg').onclick=e=>openPicker('fg',e.currentTarget);
const wh=$('wheel');
const wheelPick=e=>{const r=wh.getBoundingClientRect(),R=r.width/2,dx=e.clientX-r.left-R,dy=e.clientY-r.top-R;
  pk.h=(Math.atan2(dy,dx)*180/Math.PI+360)%360;pk.s=clamp(Math.hypot(dx,dy)/R,0,1);
  pk.rgb=hsv2rgb(pk.h,pk.s,pk.v);pkApply('wheel');};
wh.onpointerdown=e=>{wh.setPointerCapture(e.pointerId);wheelPick(e);};
wh.onpointermove=e=>{if(wh.hasPointerCapture(e.pointerId))wheelPick(e);};
$('vr').oninput=e=>{pk.v=e.target.value/100;pk.rgb=hsv2rgb(pk.h,pk.s,pk.v);pkApply('vr');};
const numsOf=(ids,max)=>{const v=ids.map(id=>$(id).value.trim());return v.some(x=>x===''||isNaN(+x))?null:v.map(x=>clamp(Math.round(+x),0,max));};
$('pHex').oninput=e=>{const v=normHex(e.target.value);e.target.classList.toggle('bad',!v);if(v)pkSetRgb(hex2rgb(v),'hex');};
RGB.forEach(id=>$(id).oninput=()=>{const v=numsOf(RGB,255);if(v)pkSetRgb(v,'rgb');});
CMYK.forEach(id=>$(id).oninput=()=>{const v=numsOf(CMYK,100);if(v)pkSetRgb(cmyk2rgb(...v),'cmyk');});
['pHex',...RGB,...CMYK].forEach(id=>{const e=$(id);
  e.onblur=()=>{e.classList.remove('bad');pkSync(null);}; // blur: chuẩn hóa lại giá trị hiển thị
  e.onkeydown=ev=>{if(ev.key==='Enter')e.blur();};});
document.addEventListener('pointerdown',e=>{if(pk.t&&!$('pick').contains(e.target)&&!e.target.closest('.chip'))closePicker();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePicker();});
$('side').addEventListener('scroll',closePicker);
addEventListener('resize',closePicker);

/* ===== Khởi động: chờ font rồi mới đo/render ===== */
document.fonts.ready.then(()=>{randomColor();randomSkew();checkDefault();render();});
</script>
</body>
